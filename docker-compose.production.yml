services:
  portal:
    image: ghcr.io/convertedweb/convertedai-portal:${PORTAL_IMAGE_TAG:-latest}
    container_name: convertedai-portal
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - proxy
    mem_limit: 1g
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=128m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: portal-proxy
